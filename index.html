<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>CTRL PAD</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow+Condensed:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #ff1a1a;
    --red-dim: #8b0000;
    --red-glow: rgba(255, 26, 26, 0.4);
    --panel: #0d0d0d;
    --surface: #141414;
    --surface2: #1c1c1c;
    --border: #2a2a2a;
    --text: #c8c8c8;
    --text-dim: #555;
    --green: #00ff88;
    --green-dim: #004d1a;
    --green-glow: rgba(0, 255, 136, 0.4);
    --amber: #ffaa00;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    background: var(--panel);
    font-family: 'Barlow Condensed', sans-serif;
    overflow: hidden;
    touch-action: manipulation;
  }

  /* Noise texture overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 100;
    opacity: 0.4;
  }

  .app {
    display: flex;
    flex-direction: column;
    height: 100%;
    padding: 16px;
    gap: 12px;
  }

  /* ── Header ── */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 4px;
  }

  .logo {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }

  .status-bar {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .status-dot {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 0.1em;
  }

  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--text-dim);
  }

  .dot.online { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .dot.error { background: var(--red); box-shadow: 0 0 6px var(--red); }

  .settings-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    padding: 5px 10px;
    cursor: pointer;
    border-radius: 3px;
    transition: all 0.2s;
  }
  .settings-btn:hover { border-color: var(--text); color: var(--text); }

  /* ── Divider ── */
  .divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--border) 20%, var(--border) 80%, transparent);
  }

  /* ── Reset Button ── */
  .reset-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 10px;
    background: var(--surface);
    border: 1px solid var(--amber);
    border-radius: 8px;
    color: var(--amber);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.15s;
    -webkit-user-select: none;
    user-select: none;
  }
  .reset-btn:active { transform: scale(0.98); background: rgba(255, 170, 0, 0.1); }
  .reset-btn:disabled { opacity: 0.5; cursor: default; }

  /* ── Button Grid ── */
  .grid {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: 1.5fr repeat(3, 1fr);
    gap: 12px;
  }

  /* ── Control Button ── */
  .ctrl-btn {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 20px;
    overflow: hidden;
    transition: transform 0.08s ease;
    -webkit-user-select: none;
    user-select: none;
  }

  .ctrl-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity 0.2s;
    border-radius: 8px;
  }

  .ctrl-btn:active { transform: scale(0.97); }

  /* Alarm button */
  .ctrl-btn.alarm {
    border-color: var(--red-dim);
    grid-column: 1;
    grid-row: 1;
  }

  .ctrl-btn.alarm::before {
    background: radial-gradient(ellipse at center, var(--red-glow) 0%, transparent 70%);
  }

  .ctrl-btn.alarm:active::before,
  .ctrl-btn.alarm.firing::before { opacity: 1; }

  .ctrl-btn.alarm .btn-icon {
    font-size: 48px;
    line-height: 1;
    filter: drop-shadow(0 0 12px var(--red));
    transition: filter 0.1s;
  }

  .ctrl-btn.alarm.firing .btn-icon {
    animation: iconPulse 0.5s ease-in-out infinite;
  }

  .ctrl-btn.alarm .btn-label {
    font-size: 20px;
    font-weight: 900;
    letter-spacing: 0.05em;
    color: var(--red);
    text-shadow: 0 0 20px var(--red), 0 0 40px var(--red-glow);
    text-transform: uppercase;
    transition: text-shadow 0.1s;
  }

  .ctrl-btn.alarm.firing .btn-label {
    animation: labelFlash 0.5s ease-in-out infinite;
  }

  .ctrl-btn.alarm .btn-sub {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    color: var(--red-dim);
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }

  /* Corner accent lines on alarm button */
  .ctrl-btn.alarm::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--red), transparent);
    opacity: 0.5;
    transition: opacity 0.2s;
  }

  .ctrl-btn.alarm.firing::after { opacity: 1; animation: scanline 1s linear infinite; }

  /* Firing Lasers button */
  .ctrl-btn.lasers {
    border-color: var(--green-dim);
    grid-column: 2;
    grid-row: 1;
  }

  .ctrl-btn.lasers::before {
    background: radial-gradient(ellipse at center, var(--green-glow) 0%, transparent 70%);
  }

  .ctrl-btn.lasers:active::before,
  .ctrl-btn.lasers.firing::before { opacity: 1; }

  .ctrl-btn.lasers .btn-icon {
    font-size: 48px;
    line-height: 1;
    filter: drop-shadow(0 0 12px var(--green));
    transition: filter 0.1s;
  }

  .ctrl-btn.lasers.firing .btn-icon {
    animation: iconPulseGreen 0.5s ease-in-out infinite;
  }

  .ctrl-btn.lasers .btn-label {
    font-size: 20px;
    font-weight: 900;
    letter-spacing: 0.05em;
    color: var(--green);
    text-shadow: 0 0 20px var(--green), 0 0 40px var(--green-glow);
    text-transform: uppercase;
    transition: text-shadow 0.1s;
  }

  .ctrl-btn.lasers.firing .btn-label {
    animation: labelFlashGreen 0.5s ease-in-out infinite;
  }

  .ctrl-btn.lasers .btn-sub {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    color: var(--green-dim);
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }

  /* Corner accent lines on lasers button */
  .ctrl-btn.lasers::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--green), transparent);
    opacity: 0.5;
    transition: opacity 0.2s;
  }

  .ctrl-btn.lasers.firing::after { opacity: 1; animation: scanline 1s linear infinite; }

  /* Shields button */
  .ctrl-btn.shields {
    border-color: #003580;
    grid-column: 3;
    grid-row: 1;
  }

  .ctrl-btn.shields::before {
    background: radial-gradient(ellipse at center, rgba(30,100,255,0.4) 0%, transparent 70%);
  }

  .ctrl-btn.shields:active::before,
  .ctrl-btn.shields.firing::before { opacity: 1; }

  .ctrl-btn.shields .btn-icon {
    font-size: 48px;
    line-height: 1;
    filter: drop-shadow(0 0 12px #4d9fff);
    transition: filter 0.1s;
  }

  .ctrl-btn.shields.firing .btn-icon {
    animation: iconPulseBlue 0.5s ease-in-out infinite;
  }

  .ctrl-btn.shields .btn-label {
    font-size: 20px;
    font-weight: 900;
    letter-spacing: 0.05em;
    color: #4d9fff;
    text-shadow: 0 0 20px #4d9fff, 0 0 40px rgba(30,100,255,0.4);
    text-transform: uppercase;
    transition: text-shadow 0.1s;
  }

  .ctrl-btn.shields.firing .btn-label {
    animation: labelFlashBlue 0.5s ease-in-out infinite;
  }

  .ctrl-btn.shields .btn-sub {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    color: #003580;
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }

  /* Corner accent lines on shields button */
  .ctrl-btn.shields::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, #4d9fff, transparent);
    opacity: 0.5;
    transition: opacity 0.2s;
  }

  .ctrl-btn.shields.firing::after { opacity: 1; animation: scanline 1s linear infinite; }

  /* Theme buttons — gradient border approximating each LIFX theme's palette */
  .ctrl-btn.theme-btn {
    border: 2px solid transparent;
    background:
      linear-gradient(var(--surface), var(--surface)) padding-box,
      var(--theme-gradient) border-box;
  }

  .ctrl-btn.theme-btn::before {
    background: radial-gradient(ellipse at center, rgba(255,255,255,0.12) 0%, transparent 70%);
  }

  .ctrl-btn.theme-btn:active::before,
  .ctrl-btn.theme-btn.active::before { opacity: 1; }

  .ctrl-btn.theme-btn .btn-label { color: #f0f0f0; text-shadow: 0 0 12px rgba(255,255,255,0.3); }
  .ctrl-btn.theme-btn .btn-sub   { color: var(--text-dim); }

  .ctrl-btn.theme-btn.active { box-shadow: 0 0 18px rgba(255,255,255,0.25); }

  .ctrl-btn.theme-mellow     { --theme-gradient: linear-gradient(135deg, hsl(235,100%,67%), hsl(284,100%,67%), hsl(329,100%,67%)); grid-column: 3; grid-row: 2; }
  .ctrl-btn.theme-tranquil   { --theme-gradient: linear-gradient(135deg, hsl(236,100%,80.5%), hsl(125,100%,80.5%), hsl(11,100%,80.5%)); grid-column: 3; grid-row: 3; }
  .ctrl-btn.theme-energizing { --theme-gradient: linear-gradient(135deg, hsl(210,100%,65.5%), hsl(157,100%,65%), hsl(124,100%,66%)); grid-column: 3; grid-row: 4; }

  /* Empty/placeholder buttons */
  .ctrl-btn.empty {
    border-style: dashed;
    opacity: 0.3;
    cursor: default;
  }

  .ctrl-btn.empty .btn-label {
    font-size: 13px;
    font-weight: 400;
    color: var(--text-dim);
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }

  /* ── Screen flash overlay ── */
  .flash-overlay {
    position: fixed;
    inset: 0;
    background: rgba(255, 26, 26, 0.15);
    pointer-events: none;
    opacity: 0;
    z-index: 50;
  }

  .flash-overlay.active {
    animation: screenFlash 0.5s ease-in-out infinite;
  }

  /* ── Settings Modal ── */
  .modal-bg {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
    backdrop-filter: blur(4px);
  }

  .modal-bg.open { opacity: 1; pointer-events: all; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 28px;
    width: 100%;
    max-width: 480px;
    transform: translateY(20px);
    transition: transform 0.25s;
  }

  .modal-bg.open .modal { transform: translateY(0); }

  .modal-title {
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px;
    color: var(--text-dim);
    letter-spacing: 0.25em;
    text-transform: uppercase;
    margin-bottom: 24px;
  }

  .field {
    margin-bottom: 18px;
  }

  .field label {
    display: block;
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-bottom: 7px;
  }

  .field input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
    padding: 10px 12px;
    outline: none;
    transition: border-color 0.2s;
  }

  .field input:focus { border-color: var(--amber); }

  .field .hint {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    color: var(--text-dim);
    margin-top: 5px;
    line-height: 1.5;
  }

  .modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 24px;
  }

  .btn-save {
    flex: 1;
    background: var(--amber);
    color: #000;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    border: none;
    border-radius: 4px;
    padding: 12px;
    cursor: pointer;
    transition: opacity 0.2s;
  }

  .btn-save:active { opacity: 0.7; }

  .btn-cancel {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    border-radius: 4px;
    padding: 12px 20px;
    cursor: pointer;
    transition: border-color 0.2s;
  }

  .btn-cancel:active { border-color: var(--text); }

  /* ── Toast notification ── */
  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(60px);
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 20px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.15em;
    color: var(--text);
    z-index: 300;
    transition: transform 0.3s ease;
    white-space: nowrap;
  }

  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.success { border-color: var(--green); color: var(--green); }
  .toast.error { border-color: var(--red); color: var(--red); }

  /* ── Color Scene Buttons ── */
  .ctrl-btn.solid-red    { border-color: #8b0000; }
  .ctrl-btn.solid-white  { border-color: #555; }
  .ctrl-btn.solid-blue   { border-color: #003580; }
  .ctrl-btn.solid-green  { border-color: #004d1a; }
  .ctrl-btn.solid-purple { border-color: #4b0082; }
  .ctrl-btn.solid-yellow { border-color: #806600; }

  .ctrl-btn.solid-red::before    { background: radial-gradient(ellipse at center, rgba(255,26,26,0.3) 0%, transparent 70%); }
  .ctrl-btn.solid-white::before  { background: radial-gradient(ellipse at center, rgba(255,255,255,0.15) 0%, transparent 70%); }
  .ctrl-btn.solid-blue::before   { background: radial-gradient(ellipse at center, rgba(30,100,255,0.3) 0%, transparent 70%); }
  .ctrl-btn.solid-green::before  { background: radial-gradient(ellipse at center, rgba(0,255,100,0.25) 0%, transparent 70%); }
  .ctrl-btn.solid-purple::before { background: radial-gradient(ellipse at center, rgba(155,48,255,0.3) 0%, transparent 70%); }
  .ctrl-btn.solid-yellow::before { background: radial-gradient(ellipse at center, rgba(255,221,51,0.3) 0%, transparent 70%); }

  .ctrl-btn.solid-red .btn-label    { color: #ff4444; text-shadow: 0 0 16px rgba(255,50,50,0.6); }
  .ctrl-btn.solid-white .btn-label  { color: #e0e0e0; text-shadow: 0 0 16px rgba(255,255,255,0.4); }
  .ctrl-btn.solid-blue .btn-label   { color: #4d9fff; text-shadow: 0 0 16px rgba(50,130,255,0.6); }
  .ctrl-btn.solid-green .btn-label  { color: #33ff88; text-shadow: 0 0 16px rgba(0,255,100,0.5); }
  .ctrl-btn.solid-purple .btn-label { color: #b366ff; text-shadow: 0 0 16px rgba(155,48,255,0.6); }
  .ctrl-btn.solid-yellow .btn-label { color: #ffe066; text-shadow: 0 0 16px rgba(255,221,51,0.6); }

  .ctrl-btn.solid-red .btn-sub    { color: #8b0000; }
  .ctrl-btn.solid-white .btn-sub  { color: #555; }
  .ctrl-btn.solid-blue .btn-sub   { color: #003580; }
  .ctrl-btn.solid-green .btn-sub  { color: #004d1a; }
  .ctrl-btn.solid-purple .btn-sub { color: #4b0082; }
  .ctrl-btn.solid-yellow .btn-sub { color: #806600; }

  /* Active/firing state for color buttons */
  .ctrl-btn.scene-btn.active::before { opacity: 1; }
  .ctrl-btn.solid-red.active    { border-color: #ff4444; box-shadow: 0 0 18px rgba(255,50,50,0.4); }
  .ctrl-btn.solid-white.active  { border-color: #e0e0e0; box-shadow: 0 0 18px rgba(255,255,255,0.3); }
  .ctrl-btn.solid-blue.active   { border-color: #4d9fff; box-shadow: 0 0 18px rgba(50,130,255,0.4); }
  .ctrl-btn.solid-green.active  { border-color: #33ff88; box-shadow: 0 0 18px rgba(0,255,100,0.35); }
  .ctrl-btn.solid-purple.active { border-color: #b366ff; box-shadow: 0 0 18px rgba(155,48,255,0.4); }
  .ctrl-btn.solid-yellow.active { border-color: #ffe066; box-shadow: 0 0 18px rgba(255,221,51,0.35); }

  /* ── Animations ── */
  @keyframes iconPulse {
    0%, 100% { filter: drop-shadow(0 0 12px var(--red)); transform: scale(1); }
    50% { filter: drop-shadow(0 0 30px var(--red)); transform: scale(1.1); }
  }

  @keyframes labelFlash {
    0%, 100% { text-shadow: 0 0 20px var(--red), 0 0 40px var(--red-glow); opacity: 1; }
    50% { text-shadow: 0 0 40px var(--red), 0 0 80px var(--red-glow); opacity: 0.7; }
  }

  @keyframes iconPulseGreen {
    0%, 100% { filter: drop-shadow(0 0 12px var(--green)); transform: scale(1); }
    50% { filter: drop-shadow(0 0 30px var(--green)); transform: scale(1.1); }
  }

  @keyframes labelFlashGreen {
    0%, 100% { text-shadow: 0 0 20px var(--green), 0 0 40px var(--green-glow); opacity: 1; }
    50% { text-shadow: 0 0 40px var(--green), 0 0 80px var(--green-glow); opacity: 0.7; }
  }

  @keyframes iconPulseBlue {
    0%, 100% { filter: drop-shadow(0 0 12px #4d9fff); transform: scale(1); }
    50% { filter: drop-shadow(0 0 30px #4d9fff); transform: scale(1.1); }
  }

  @keyframes labelFlashBlue {
    0%, 100% { text-shadow: 0 0 20px #4d9fff, 0 0 40px rgba(30,100,255,0.4); opacity: 1; }
    50% { text-shadow: 0 0 40px #4d9fff, 0 0 80px rgba(30,100,255,0.4); opacity: 0.7; }
  }

  @keyframes screenFlash {
    0%, 100% { opacity: 0; }
    50% { opacity: 1; }
  }

  @keyframes scanline {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
  }
</style>
</head>
<body>

<div class="flash-overlay" id="flashOverlay"></div>
<audio id="alarmAudioEl" src="Alarm.mp3" loop preload="auto"></audio>

<div class="app">
  <div class="header">
    <span class="logo">CTRL PAD v1.0</span>
    <div class="status-bar">
      <div class="status-dot">
        <div class="dot" id="lifxDot"></div>
        <span id="lifxStatus">NO TOKEN</span>
      </div>
      <button class="settings-btn" onclick="openSettings()">⚙ CONFIG</button>
    </div>
  </div>

  <div class="divider"></div>

  <!-- RESET BUTTON — power-cycles the "basement" group and sets it back to
       full brightness, as a manual escape hatch when a scene leaves the
       lights in a bad state. -->
  <button class="reset-btn" id="btn-reset" onclick="handleReset()">🔄 RESET</button>

  <div class="grid">

    <!-- ALARM BUTTON -->
    <button class="ctrl-btn scene-btn alarm" id="btn-alarm" data-scene="alarm" ontouchstart="handleScene(event, 'alarm')" onclick="handleScene(event, 'alarm')">
      <div class="btn-icon">🚨</div>
      <div class="btn-label">ALARM</div>
      <div class="btn-sub">STROBE RED · ALERT TONE</div>
    </button>

    <!-- FIRING LASERS BUTTON -->
    <button class="ctrl-btn scene-btn lasers" id="btn-lasers" data-scene="lasers" ontouchstart="handleScene(event, 'lasers')" onclick="handleScene(event, 'lasers')">
      <div class="btn-icon">🔫</div>
      <div class="btn-label">FIRING LASERS</div>
      <div class="btn-sub">METEOR GREEN · LASER SFX</div>
    </button>

    <!-- SHIELDS BUTTON -->
    <button class="ctrl-btn scene-btn shields" id="btn-shields" data-scene="shields" ontouchstart="handleScene(event, 'shields')" onclick="handleScene(event, 'shields')">
      <div class="btn-icon">🛡️</div>
      <div class="btn-label">SHIELDS</div>
      <div class="btn-sub">FLICKER · SHIELD TONE</div>
    </button>


    <!-- SOLID RED -->

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
  // ── State ──
  let config = {
    token: localStorage.getItem('lifx_token') || 'c902c34d223b36471a93adbce19f7545dd12323779092c4ebd824987e41ba0ce',
    selector: localStorage.getItem('lifx_selector') || 'label:D&D Lightstrip',
    selector2: localStorage.getItem('lifx_selector2') || 'label:D&D Lightstrip 2',
    cycles: parseInt(localStorage.getItem('lifx_cycles') || '10')
  };

  let isFiring = false;
  let stopFiring = null;
  let toastTimer;

  // ── Audio setup ──
  // 🔊 To swap the sound: rename your file to Alarm.mp3 and upload it
  //    to the same folder as this index.html in your GitHub repo
  const alarmAudio = document.getElementById('alarmAudioEl');
  alarmAudio.loop = true;

  alarmAudio.addEventListener('canplaythrough', () => showToast('AUDIO READY', 'success'));
  alarmAudio.addEventListener('error', () => showToast('AUDIO ERROR — check Alarm.mp3 is in the repo', 'error'));

  // Scenes with stopOnAudioEnd run their light effect continuously (no fixed
  // lap count) and rely on 'ended' to wind everything down in sync with the
  // one-shot audio clip, instead of a fixed timer that could drift out of
  // sync with the actual clip length. keepLightsOn=true means this reset the
  // button/audio/timer state but leave the physical light as-is (already
  // settled full-on by the flicker) rather than powering it off — so nothing
  // has to be manually re-tapped just to keep the light on. audioStopTriggered
  // guards against a double-fire. Guarded by transitionInProgress the same
  // way as the meteor's auto-stop timer so it can't race a manual transition
  // to another scene.
  let audioStopTriggered = false;
  async function stopSceneForAudio() {
    const sceneId = activeScene;
    const scene = scenes[sceneId];
    if (!scene || !scene.stopOnAudioEnd || transitionInProgress || audioStopTriggered) return;
    audioStopTriggered = true;
    transitionInProgress = true;
    try {
      await deactivateScene(sceneId, false, true);
    } finally {
      transitionInProgress = false;
    }
  }
  alarmAudio.addEventListener('ended', stopSceneForAudio);

  // ── Init ──
  updateStatusDot();
  if (config.token) getSelectors().forEach(sel => getZoneCount(sel));

  function startAlarmSound() {
    alarmAudio.currentTime = 0;
    alarmAudio.play().catch(err => showToast(`PLAY ERROR: ${err.message}`, 'error'));
  }

  function stopAlarmSound() {
    alarmAudio.pause();
    alarmAudio.currentTime = 0;
  }

  function playSceneAudio(scene) {
    if (!scene.playAudio || !scene.audioSrc) return;
    if (alarmAudio.src !== scene.audioSrc) alarmAudio.src = scene.audioSrc;
    alarmAudio.loop = scene.loop !== false;
    alarmAudio.currentTime = 0;
    audioStopTriggered = false;
    alarmAudio.play().catch(err => showToast(`PLAY ERROR: ${err.message}`, 'error'));
  }

  // ── Scene Definitions ──
  // To add audio to any scene: set playAudio to true and set audioSrc to your file URL
  const scenes = {
    alarm: {
      label:     'STROBE RED · ALERT TONE',
      playAudio: true,                  // ← true = plays audio, false = silent
      audioSrc:  'Alarm.mp3',          // ← swap filename or URL here
      light:     'strobe',
      color:     'red',
      period:    1.93,
      cycles:    5,  // auto-stop after this many pulse cycles, reverting to whatever was on before
      audioTailSeconds: 1,  // let Alarm.mp3 keep playing this long after the light switches back
    },
    lasers: {
      label:     'METEOR GREEN · LASER SFX',
      playAudio: true,
      audioSrc:  'Lasers.mp3',
      light:     'meteor',
      color:     'green',
      period:    2,
      cycles:    1,
      loop:      false,
      stopEarly: 0.5,  // cut the effect (and its audio) this many seconds before period would naturally finish
    },
    shields: {
      label:     'FLICKER · SHIELD TONE',
      playAudio: true,
      audioSrc:  'shields.mp3',
      light:     'flicker',
      color:     'blue',           // just picks the on-screen flash-overlay tint
      // No palette to paint first — flickers whatever color the light is
      // already showing, skipping that repaint step entirely.
      period:        0.25,         // seconds between flicker ticks
      flickerAmount: 1.0,          // 0–1, how far brightness swings each tick — 1.0 = full 0–100%
      loop:      false,
      flickerTicks: 5,  // total flicker ticks (including the first), then settle to full brightness
      // Effect settles to full brightness after flickerTicks and stays there
      // — the scene deactivates when the audio clip finishes, but leaves the
      // light on instead of powering it off (see keepLightsOn in
      // stopSceneForAudio/deactivateScene below).
      stopOnAudioEnd: true,
    },
    red: {
      label:     'SOLID RED',
      playAudio: false,                 // ← set to true and add audioSrc to add sound
      audioSrc:  '',
      light:     'solid',
      color:     'red saturation:1.0 brightness:1.0',
    },
    white: {
      label:     'SOLID WHITE',
      playAudio: false,
      audioSrc:  '',
      light:     'solid',
      color:     'kelvin:9000 saturation:0 brightness:1.0',
    },
    blue: {
      label:     'SOLID BLUE',
      playAudio: false,
      audioSrc:  '',
      light:     'solid',
      color:     'blue saturation:1.0 brightness:1.0',
    },
    green: {
      label:     'SOLID GREEN',
      playAudio: false,
      audioSrc:  '',
      light:     'solid',
      color:     'green saturation:1.0 brightness:1.0',
    },
    purple: {
      label:     'SOLID PURPLE',
      playAudio: false,
      audioSrc:  '',
      light:     'solid',
      color:     'purple saturation:1.0 brightness:1.0',
    },
    yellow: {
      label:     'SOLID YELLOW',
      playAudio: false,
      audioSrc:  '',
      light:     'solid',
      color:     'yellow saturation:1.0 brightness:1.0',
    },
    // LIFX's cloud API has no endpoint to activate a built-in Theme by name.
    // Each theme paints a real static gradient across the strip's own zones
    // using custom hue/saturation colors.
    mellow: {
      label:     'THEME · MELLOW',
      playAudio: false,
      audioSrc:  '',
      light:     'gradientSmooth',
      stops:     [{ hue: 235, saturation: 66 }, { hue: 284, saturation: 66 }, { hue: 329, saturation: 66 }],
    },
    tranquil: {
      label:     'THEME · TRANQUIL',
      playAudio: false,
      audioSrc:  '',
      light:     'gradientSmooth',
      // Matches the LIFX app's Colors tab → Gradient style, Custom stops —
      // smoothly blended per-zone rather than banded like the other themes.
      stops:     [{ hue: 244, saturation: 30 }, { hue: 18, saturation: 30 }, { hue: 133, saturation: 30 }],
    },
    energizing: {
      label:     'THEME · ENERGIZING',
      playAudio: false,
      audioSrc:  '',
      light:     'gradientSmooth',
      stops:     [{ hue: 210, saturation: 69 }, { hue: 157, saturation: 70 }, { hue: 124, saturation: 68 }],
    },
  };

  // ── LIFX API ──
  function getSelectors() {
    const selectors = [config.selector || 'all'];
    if (config.selector2) selectors.push(config.selector2);
    return [...new Set(selectors)].map(s => encodeURIComponent(s));
  }

  async function lifxStrobe(selector, color = 'red', period = 0.76, cycles = 9999) {
    const headers = { 'Authorization': `Bearer ${config.token}`, 'Content-Type': 'application/json' };

    // The laser meteor effect deliberately zeroes most zones' brightness for
    // its blackout trail, and that per-zone brightness sticks around after
    // the effect ends. effects/pulse doesn't repaint per-zone color data —
    // it just pulses on top of whatever's already there — so without this
    // reset the strip can come back "on" but stuck invisible at brightness 0
    // if a meteor ran at any point before. Always start a strobe from a
    // known-good baseline, awaited before the pulse call so it can't race it.
    // Pinning kelvin explicitly (not just brightness) matters here too: if an
    // effect gets cancelled and the device falls back to showing this
    // baseline instead of the pulse color, we want that fallback to be a
    // known-good white, not whatever kelvin the device happened to drift to.
    await fetch(`https://api.lifx.com/v1/lights/${selector}/state`, {
      method: 'PUT', headers,
      body: JSON.stringify({ color: 'kelvin:9000 brightness:1.0', power: 'on', duration: 0 })
    }).catch(() => null);

    const pulseRes = await fetch(`https://api.lifx.com/v1/lights/${selector}/effects/pulse`, {
      method: 'POST', headers,
      body: JSON.stringify({
        color: 'brightness:0.0',
        from_color: color,
        period,
        cycles,
        // persist:true would leave the light frozen at whichever pulse frame
        // it happened to be on when cancelled (which alternates down to
        // brightness 0 every half-period) — a likely culprit for the light
        // coming back dark and refusing to strobe after being interrupted
        // (e.g. by Reset) mid-pulse. We always send an explicit state right
        // before starting the pulse anyway, so there's nothing to gain by
        // persisting the cancelled frame — false (the default) is safer.
        persist: false,
        power_on: true
      })
    }).catch(() => null);

    if (!pulseRes || !pulseRes.ok) {
      const e = pulseRes ? await pulseRes.json().catch(() => ({})) : {};
      showToast(`LIFX ERROR: ${e.error || 'PULSE FAILED'}`, 'error');
    }
  }

  // Zone-based effects (the "morph" effect only works on Tile/Candle matrix
  // devices, not linear strips like this one — so gradients are painted by
  // splitting the strip's actual zones and setting each band directly).
  const zoneCountCache = {};

  // Cached so the first press of a zone-based effect doesn't have to wait on
  // this lookup — see the prefetch call in Init below.
  async function getZoneCount(selector) {
    if (zoneCountCache[selector]) return zoneCountCache[selector];
    const headers = { 'Authorization': `Bearer ${config.token}`, 'Content-Type': 'application/json' };
    const getRes = await fetch(`https://api.lifx.com/v1/lights/${selector}`, { headers }).catch(() => null);
    if (!getRes || !getRes.ok) return null; // API unreachable right now — stay quiet, like the other buttons
    const lights = await getRes.json().catch(() => []);
    const light = lights[0];
    if (!light || !light.connected) return null; // no matching light, or it's offline — nothing to paint
    const zoneCount = light.zones?.count;
    if (!zoneCount) { showToast('LIFX ERROR: LIGHT HAS NO ZONES', 'error'); return null; }
    zoneCountCache[selector] = zoneCount;
    return zoneCount;
  }

  // Shortest-arc hue interpolation (hue is circular, 0-360) — going the long
  // way around would pass through unrelated colors instead of blending
  // directly between two stops, same as the LIFX app's own gradient picker.
  function lerpHue(h1, h2, t) {
    const diff = ((h2 - h1 + 540) % 360) - 180;
    return (h1 + diff * t + 360) % 360;
  }

  // Matches the LIFX app's Colors tab "Gradient" style (Custom stops) rather
  // than lifxGradient's flat bands: sets every individual zone to its own
  // interpolated color between the given stops, so the blend is smooth
  // instead of stepped. Costs one API call per zone (a one-time paint, not
  // a repeating effect, so that's an acceptable tradeoff for the smoothness).
  // Paints bandCount bands (not one call per individual zone) with colors
  // interpolated at each band's midpoint, each band awaited in sequence —
  // firing many concurrent writes to the same physical strip is the same
  // race we've hit before (the laser meteor's zone painting, the Reset
  // button's power cycle): some land, some get dropped. Every request over
  // the cloud API is its own round-trip (there's no single "set all zones"
  // call like the LIFX app gets over the LAN protocol), so fewer, larger
  // bands trade a bit of blend precision for a much shorter total wait.
  async function lifxGradientSmooth(selector, stops, bandCount = 8) {
    const headers = { 'Authorization': `Bearer ${config.token}`, 'Content-Type': 'application/json' };

    const zoneCount = await getZoneCount(selector);
    if (!zoneCount) return;

    const bands = Math.min(bandCount, zoneCount);
    const bandSize = Math.ceil(zoneCount / bands);
    const segments = stops.length - 1;
    let anyFailed = false;

    for (let b = 0; b < bands; b++) {
      const start = b * bandSize;
      const end = Math.min(start + bandSize - 1, zoneCount - 1);
      if (start > end) break;

      const mid = (start + end) / 2;
      const t = zoneCount > 1 ? mid / (zoneCount - 1) : 0;
      const segPos = Math.min(t * segments, segments - 0.0001);
      const segIndex = Math.floor(segPos);
      const segT = segPos - segIndex;
      const a = stops[segIndex], c = stops[segIndex + 1];
      const hue = lerpHue(a.hue, c.hue, segT);
      const saturation = (a.saturation + (c.saturation - a.saturation) * segT) / 100;

      const res = await fetch(`https://api.lifx.com/v1/lights/${selector}|${start}-${end}/state`, {
        method: 'PUT', headers,
        body: JSON.stringify({
          color: `hue:${hue.toFixed(1)} saturation:${saturation.toFixed(3)} kelvin:9000`,
          brightness: 1, power: 'on', duration: 0.5
        })
      }).catch(() => null);
      if (!res || !res.ok) anyFailed = true;
    }

    if (anyFailed) showToast('LIFX ERROR: GRADIENT PARTIALLY FAILED', 'error');
  }

  // Paints a small bright head near the start of a multizone strip and blacks
  // out the rest, ready for the "move" effect to chase it down the strip — the
  // closest native LIFX effect to a meteor streak. Split from lifxEffectMove
  // so the caller can fire scene audio in between, once the strip is actually
  // dark, to sync the sound with the visual. The blackout and the head are
  // written sequentially (not in parallel) because two concurrent zone writes
  // to the same physical strip can race on the mesh — the loser gets dropped,
  // which is what left the whole strip lit behind the meteor instead of going
  // dark.
  async function lifxMeteorPrepare(selector, color = 'green') {
    const headers = { 'Authorization': `Bearer ${config.token}`, 'Content-Type': 'application/json' };

    const zoneCount = await getZoneCount(selector);
    if (!zoneCount) return;

    // Pinning kelvin here (not just brightness/saturation) even though it's
    // invisible at brightness 0 — leaving it unspecified means these zones
    // just keep whatever kelvin they last had, and if that ever gets shown
    // again without an explicit color (e.g. after an effect gets cancelled),
    // an undefined kelvin is how a light ends up looking randomly orange.
    const offRes = await fetch(`https://api.lifx.com/v1/lights/${selector}/state`, {
      method: 'PUT', headers,
      body: JSON.stringify({ color: 'kelvin:9000 saturation:0 brightness:0', power: 'on', duration: 0 })
    }).catch(() => null);

    const headLength = Math.min(2, zoneCount);
    const headRes = await fetch(`https://api.lifx.com/v1/lights/${selector}|0-${headLength - 1}/state`, {
      method: 'PUT', headers,
      body: JSON.stringify({ color: `${color} saturation:1.0 brightness:1.0`, power: 'on', duration: 0 })
    }).catch(() => null);

    if (!offRes || !offRes.ok || !headRes || !headRes.ok) {
      showToast('LIFX ERROR: METEOR SETUP FAILED', 'error');
    }
  }

  // Fires LIFX's zone "move" effect on whatever colors are currently painted
  // on the strip. Used by the laser meteor (a bright head + blackout painted
  // first, since moving a solid color shows no visible motion).
  async function lifxEffectMove(selector, period = 2, cycles = 9999) {
    const headers = { 'Authorization': `Bearer ${config.token}`, 'Content-Type': 'application/json' };

    const moveRes = await fetch(`https://api.lifx.com/v1/lights/${selector}/effects/move`, {
      method: 'POST', headers,
      body: JSON.stringify({ direction: 'forward', period, cycles, power_on: true })
    }).catch(() => null);

    if (!moveRes || !moveRes.ok) {
      const e = moveRes ? await moveRes.json().catch(() => ({})) : {};
      showToast(`LIFX ERROR: ${e.error || 'MOVE FAILED'}`, 'error');
    }
  }

  // LIFX's HTTP API has no native flicker effect, so this drives one from the
  // client: each tick sets a random overall brightness (leaving each zone's
  // painted hue/saturation alone, since "brightness" here is a top-level
  // scale rather than part of the color string). amount is 0–1 — how far
  // brightness swings below full each tick; 1.0 swings across the full range.
  async function lifxFlickerTick(selector, amount = 1.0) {
    const headers = { 'Authorization': `Bearer ${config.token}`, 'Content-Type': 'application/json' };
    const min = 1 - amount;
    const brightness = min + Math.random() * amount;
    await fetch(`https://api.lifx.com/v1/lights/${selector}/state`, {
      method: 'PUT', headers,
      body: JSON.stringify({ brightness, power: 'on', duration: 0 })
    }).catch(() => null);
  }

  async function lifxSolid(selector, color) {
    const res = await fetch(`https://api.lifx.com/v1/lights/${selector}/state`, {
      method: 'PUT',
      headers: { 'Authorization': `Bearer ${config.token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ color, power: 'on', duration: 0.3 })
    }).catch(() => null);
    if (res && !res.ok) { const e = await res.json().catch(() => ({})); showToast(`LIFX ERROR: ${e.error || res.status}`, 'error'); }
  }

  // Stops whatever device-side firmware effect (move, pulse, breathe, etc.)
  // is currently running, without changing power or color. A light can only
  // run one such effect at a time, and switching scenes intentionally skips
  // lifxOff (to avoid racing the new scene's own lights) — so without this,
  // a still-active effect from the previous scene (e.g. the laser's move
  // effect) could keep fighting a freshly-started one for control of the
  // device instead of being cleanly replaced.
  async function lifxCancelEffects(selector) {
    const headers = { 'Authorization': `Bearer ${config.token}`, 'Content-Type': 'application/json' };
    await fetch(`https://api.lifx.com/v1/lights/${selector}/effects/off`, {
      method: 'POST', headers,
      body: JSON.stringify({ power_off: false })
    }).catch(() => {});
  }

  async function lifxOff(selector) {
    const headers = { 'Authorization': `Bearer ${config.token}`, 'Content-Type': 'application/json' };
    await lifxCancelEffects(selector);
    await fetch(`https://api.lifx.com/v1/lights/${selector}/state`, {
      method: 'PUT', headers,
      body: JSON.stringify({ power: 'off', duration: 0 })
    }).catch(() => {});
  }

  // ── Scene Engine ──
  const flashColors = {
    red:   'rgba(255, 26, 26, 0.15)',
    green: 'rgba(0, 255, 136, 0.15)',
    blue:  'rgba(30, 100, 255, 0.15)',
  };
  let activeScene = null;
  let touchHandled = false;
  let sceneAutoStopTimer = null;
  let flickerInterval = null;

  let transitionInProgress = false;

  // Shared by any cycle-limited effect (the laser meteor, the alarm strobe)
  // that should stop on its own once its cycles finish, reverting to
  // whatever scene (if any) was active right before it started instead of
  // just turning off — falls back to off if nothing was active. Guarded so
  // a timer that fires while the user has already moved on to another
  // button can't race that transition and kill its lights (this used to
  // call deactivateScene directly, unguarded by transitionInProgress, which
  // could turn a freshly-started scene back off moments after it started).
  // audioTailSeconds (optional) lets the audio ride out past the light
  // switch instead of cutting off mid-clip — scheduled independently right
  // when the timer fires, so it isn't held up by however long the light
  // revert's own network calls take.
  function scheduleAutoStop(sceneId, revertToSceneId, delaySeconds, audioTailSeconds = 0) {
    sceneAutoStopTimer = setTimeout(async () => {
      sceneAutoStopTimer = null;
      if (transitionInProgress || activeScene !== sceneId) return;
      transitionInProgress = true;

      if (audioTailSeconds > 0) {
        setTimeout(() => { alarmAudio.pause(); alarmAudio.currentTime = 0; }, audioTailSeconds * 1000);
      }

      try {
        if (revertToSceneId && scenes[revertToSceneId]) {
          // switching=true: skip lifxOff, the revert below sets the real end state
          await deactivateScene(sceneId, true, false, audioTailSeconds > 0);
          await activateScene(revertToSceneId);
        } else {
          await deactivateScene(sceneId, false, false, audioTailSeconds > 0);
        }
      } finally {
        transitionInProgress = false;
      }
    }, delaySeconds * 1000);
  }

  async function handleScene(e, sceneId) {
    if (e.type === 'touchstart') { touchHandled = true; }
    if (e.type === 'click' && touchHandled) { touchHandled = false; return; }
    e.preventDefault();

    if (transitionInProgress) return;
    transitionInProgress = true;

    try {
      if (activeScene === sceneId) {
        // Tapping the active button turns everything off
        await deactivateScene(sceneId, false);
      } else {
        // Override: deactivate UI only (no lifxOff), let new scene take over lights directly
        const previousSceneId = activeScene;
        if (activeScene) await deactivateScene(activeScene, true);
        await activateScene(sceneId, previousSceneId);
      }
    } finally {
      transitionInProgress = false;
    }
  }

  // Manual escape hatch for when a scene leaves the lights in a bad state:
  // power-cycles the "basement" group (off, then on) and sets it back to
  // full brightness, regardless of whatever scene/effect was last running.
  // Fixed to the "basement" group rather than the configured selector, since
  // the point is to recover the physical lights no matter what's configured.
  async function handleReset() {
    if (transitionInProgress) return;
    transitionInProgress = true;
    const btn = document.getElementById('btn-reset');
    try {
      if (!config.token) { showToast('NO TOKEN — open Config first', 'error'); return; }
      if (activeScene) await deactivateScene(activeScene, true);

      btn.disabled = true;
      const selector = encodeURIComponent('group:Basement');
      const headers = { 'Authorization': `Bearer ${config.token}`, 'Content-Type': 'application/json' };
      const wait = ms => new Promise(r => setTimeout(r, ms));

      // Interrupting an active effect (e.g. hitting Reset mid-strobe) and
      // then power-cycling right away can send the device several commands
      // faster than it can actually process them over the mesh — the same
      // class of race we saw with the laser meteor's zone painting. A short
      // settle pause between each step gives the device time to actually
      // apply one before the next arrives, instead of leaving it in a
      // confused state where even a fresh effect afterward won't start.
      await lifxCancelEffects(selector);
      await wait(300);
      await fetch(`https://api.lifx.com/v1/lights/${selector}/state`, {
        method: 'PUT', headers, body: JSON.stringify({ power: 'off', duration: 0 })
      }).catch(() => null);
      await wait(300);
      await fetch(`https://api.lifx.com/v1/lights/${selector}/state`, {
        method: 'PUT', headers, body: JSON.stringify({ power: 'on', duration: 0 })
      }).catch(() => null);
      await wait(300);
      // Explicitly pinning kelvin (not just brightness) to a known-good
      // white — an unspecified kelvin just inherits whatever the device
      // drifted to, which is how it ends up looking randomly orange.
      const res = await fetch(`https://api.lifx.com/v1/lights/${selector}/state`, {
        method: 'PUT', headers, body: JSON.stringify({ color: 'kelvin:9000 saturation:0', brightness: 1.0, duration: 0 })
      }).catch(() => null);

      if (res && res.ok) showToast('RESET COMPLETE', 'success');
      else { const e = res ? await res.json().catch(() => ({})) : {}; showToast(`LIFX ERROR: ${e.error || 'RESET FAILED'}`, 'error'); }
    } finally {
      btn.disabled = false;
      transitionInProgress = false;
    }
  }

  async function activateScene(sceneId, revertToSceneId = null) {
    const scene = scenes[sceneId];
    const btn = document.getElementById(`btn-${sceneId}`);
    const overlay = document.getElementById('flashOverlay');

    activeScene = sceneId;
    btn.classList.add('active');
    if (scene.light === 'strobe' || scene.light === 'meteor' || scene.light === 'flicker') {
      btn.classList.add('firing');
      overlay.style.background = flashColors[scene.color] || flashColors.red;
      overlay.classList.add('active');
    }
    btn.querySelector('.btn-sub').textContent = 'TAP TO STOP';

    // Audio — strobe, meteor, and flicker scenes delay playback until the
    // light call actually goes out (below), so the sound lines up with the
    // visual instead of firing before the effect has triggered. Other
    // scenes play right away.
    const delaysAudio = scene.light === 'meteor' || scene.light === 'strobe' || scene.light === 'flicker';
    if (!delaysAudio) playSceneAudio(scene);

    // Lights
    if (!config.token) { showToast('NO TOKEN — open Config first', 'error'); return; }
    const selectors = getSelectors();
    if (scene.light === 'strobe') {
      await Promise.all(selectors.map(sel => lifxStrobe(sel, scene.color, scene.period, scene.cycles)));
      playSceneAudio(scene);
      // If cycles is capped (not the default endless strobe), auto-stop once
      // they finish rather than requiring another tap — see scheduleAutoStop.
      if (scene.cycles) {
        scheduleAutoStop(sceneId, revertToSceneId, scene.cycles * scene.period - (scene.stopEarly || 0), scene.audioTailSeconds);
      }
    }
    if (scene.light === 'meteor') {
      await Promise.all(selectors.map(sel => lifxMeteorPrepare(sel, scene.color)));
      playSceneAudio(scene);
      await Promise.all(selectors.map(sel => lifxEffectMove(sel, scene.period, scene.cycles)));
      // One lap and done — see scheduleAutoStop.
      if (scene.cycles) {
        scheduleAutoStop(sceneId, revertToSceneId, scene.cycles * scene.period - (scene.stopEarly || 0));
      }
    }
    if (scene.light === 'flicker') {
      // No repaint step — flickers whatever color is currently showing.
      playSceneAudio(scene);
      // Ticks on a fixed interval, capped at flickerTicks total rather than
      // running for a fixed duration — a duration at this tick rate let
      // requests queue up faster than LIFX's cloud API could apply them, so
      // stragglers kept landing well after the flicker was meant to be done.
      // Capping the tick count keeps it short and simple. First tick fires
      // immediately, right alongside the audio, instead of being awaited
      // first — the tick cap already keeps things from running long, so
      // there's no need to delay the audio for it anymore.
      let ticksSoFar = 0;
      const maxTicks = scene.flickerTicks || 4;
      const fireFlickerTick = () => {
        ticksSoFar++;
        if (ticksSoFar >= maxTicks) {
          clearInterval(flickerInterval);
          flickerInterval = null;
          selectors.forEach(sel => lifxFlickerTick(sel, 0)); // amount 0 → settles at full brightness
        } else {
          selectors.forEach(sel => lifxFlickerTick(sel, scene.flickerAmount));
        }
      };
      fireFlickerTick();
      flickerInterval = setInterval(fireFlickerTick, scene.period * 1000);
    }
    if (scene.light === 'solid')  await Promise.all(selectors.map(sel => lifxSolid(sel, scene.color)));
    if (scene.light === 'gradientSmooth') await Promise.all(selectors.map(sel => lifxGradientSmooth(sel, scene.stops)));
  }

  async function deactivateScene(sceneId, switching = false, keepLightsOn = false, keepAudioPlaying = false) {
    const scene = scenes[sceneId];
    const btn = document.getElementById(`btn-${sceneId}`);
    const overlay = document.getElementById('flashOverlay');

    if (sceneAutoStopTimer) { clearTimeout(sceneAutoStopTimer); sceneAutoStopTimer = null; }
    if (flickerInterval) { clearInterval(flickerInterval); flickerInterval = null; }

    activeScene = null;
    btn.classList.remove('active', 'firing');
    overlay.classList.remove('active');
    btn.querySelector('.btn-sub').textContent = scene.label;

    // Stop audio — unless the caller wants it to ride out a bit longer past
    // the light switch (see scheduleAutoStop's audioTailSeconds), in which
    // case it schedules the actual stop itself.
    if (!keepAudioPlaying) {
      alarmAudio.pause();
      alarmAudio.currentTime = 0;
    }

    // Only call lifxOff if we are truly turning off (not switching to another
    // scene, and not a scene that wants to leave its lights as-is once it
    // winds down — see stopSceneForAudio).
    if (config.token && !switching && !keepLightsOn) {
      const selectors = getSelectors();
      await Promise.all(selectors.map(sel => lifxOff(sel)));
    }
  }

  // ── Settings ──
  function openSettings() {
    document.getElementById('tokenInput').value = config.token;
    document.getElementById('selectorInput').value = config.selector;
    document.getElementById('selector2Input').value = config.selector2;
    document.getElementById('cyclesInput').value = config.cycles;
    document.getElementById('modalBg').classList.add('open');
  }

  function closeSettings() {
    document.getElementById('modalBg').classList.remove('open');
  }

  function saveSettings() {
    const token = document.getElementById('tokenInput').value.trim();
    const selector = document.getElementById('selectorInput').value.trim() || 'all';
    const selector2 = document.getElementById('selector2Input').value.trim();
    const cycles = parseInt(document.getElementById('cyclesInput').value) || 10;

    config = { token, selector, selector2, cycles };
    localStorage.setItem('lifx_token', token);
    localStorage.setItem('lifx_selector', selector);
    localStorage.setItem('lifx_selector2', selector2);
    localStorage.setItem('lifx_cycles', cycles);

    updateStatusDot();
    closeSettings();
    showToast('CONFIG SAVED', 'success');
    if (config.token) getSelectors().forEach(sel => getZoneCount(sel));
  }

  function updateStatusDot() {
    const dot = document.getElementById('lifxDot');
    const label = document.getElementById('lifxStatus');
    if (config.token) {
      dot.className = 'dot online';
      label.textContent = 'LIFX READY';
    } else {
      dot.className = 'dot error';
      label.textContent = 'NO TOKEN';
    }
  }

  // ── Toast ──
  function showToast(msg, type = '') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = `toast ${type} show`;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.classList.remove('show'); }, 3000);
  }

  // Close modal on background tap
  document.getElementById('modalBg').addEventListener('click', function(e) {
    if (e.target === this) closeSettings();
  });

  // iOS requires playback to be triggered by a user gesture — the button tap handles this automatically.
</script>
</body>
</html>
